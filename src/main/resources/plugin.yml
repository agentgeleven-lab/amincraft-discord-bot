name: AminPlayDiscord
version: 1.1.0
main: cn.aminplay.discord.AminPlayDiscord
api-version: '1.21'
description: Amincraft 的 Discord 机器人（身份面板、公告、管理指令、开关服通知、聊天互通）
authors: [Amincraft]
softdepend: [MiniGameHub]
commands:
  discordbot:
    description: Discord 机器人管理
    usage: /discordbot <status|reload|set <项目> <值>|admins|sources <list|add|remove>|panel …|replays <status|post-now>|keys>
    permission: aminplay.discord.admin
permissions:
  aminplay.discord.admin:
    description: 使用 /discordbot
    default: op
